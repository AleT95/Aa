# =============================================================
#  FILE DI CONFIGURAZIONE
#  Qui cambi i parametri SENZA toccare il codice Python.
#  Regole YAML: l'indentazione (gli spazi) conta! Usa spazi, mai TAB.
#  Il simbolo # indica un commento (viene ignorato).
# =============================================================

# --- Dati di mercato -----------------------------------------
dati:
  fornitore: yfinance          # oggi "yfinance"; in futuro potremo aggiungerne altri
  anni_storico: 12             # quanti anni di storia scaricare (per il backtest servono 10+)
  cartella_cache: data/cache   # dove salvare i dati scaricati (così non li riscarichiamo ogni volta)
  validita_cache_ore: 12       # dopo quante ore i dati in cache sono considerati "vecchi"

# --- ETF "termometro" di mercato -------------------------------
# Ogni voce: nome leggibile -> ticker su Yahoo Finance
etf_benchmark: URTH            # ETF di confronto per il "compra e tieni" (MSCI World)

etf_aree:
  mondo: URTH                  # iShares MSCI World (quotato in USA)
  usa_sp500: SPY
  usa_nasdaq100: QQQ
  europa: VGK
  emergenti: EEM

etf_settori:
  tecnologia: XLK
  salute: XLV
  energia: XLE
  finanza: XLF

# --- Azioni candidate, raggruppate per settore/area ------------
# La chiave DEVE corrispondere a un nome in etf_settori o etf_aree:
# così l'app sa quale ETF "guardare" per decidere se comprare queste azioni.
azioni:
  tecnologia: [AAPL, MSFT, NVDA, GOOGL, META, AVGO, ORCL, ADBE, CRM, AMD]
  salute:     [JNJ, UNH, LLY, PFE, MRK, ABBV, TMO, ABT]
  energia:    [XOM, CVX, COP, SLB, EOG, PSX]
  finanza:    [JPM, BAC, WFC, GS, MS, BLK, V, MA]
  europa:     [ASML, SAP, NVO, SHEL, AZN, TTE]   # ADR/titoli quotati in USA

# --- Parametri della strategia (usati dalla Fase 2) ------------
# Un ETF è "in trend positivo" quando TUTTE queste condizioni sono vere:
#   prezzo > media mobile breve, prezzo > media mobile lunga, momentum > 0
strategia:
  media_mobile_breve: 50       # giorni
  media_mobile_lunga: 200      # giorni
  momentum_mesi: [3, 6]        # periodi del momentum, in mesi (si fa la media dei due)
  azioni_per_settore: 4        # quante azioni "più forti" comprare per ogni settore positivo
  filtro_globale: mondo        # se l'ETF "mondo" è negativo si vende tutto (scrivi "nessuno" per disattivarlo)
  ribilanciamento: mensile     # ogni quanto rifare la classifica delle azioni: mensile | settimanale

# --- Backtest (Fase 2) -----------------------------------------
backtest:
  tasso_senza_rischio_pct: 2   # rendimento "sicuro" annuo usato nello Sharpe ratio
  cartella_risultati: risultati

# --- Gestione del rischio (Fase 3) -----------------------------
rischio:
  capitale_iniziale: 100000    # in dollari
  max_per_azione_pct: 5        # massimo 5% del capitale per singola azione

  # Stop loss su OGNI posizione
  stop_loss_pct: 8             # vendi se il titolo scende dell'8%...
  stop_loss_tipo: trailing     # ...dal prezzo di acquisto ("fisso") o dal massimo raggiunto dopo l'acquisto ("trailing")
  giorni_attesa_dopo_stop: 20  # dopo uno stop, quel titolo non si ricompra per 20 giorni di borsa

  # Limiti di perdita: se superati l'app si BLOCCA da sola
  perdita_max_giornaliera_pct: 3    # perdita del portafoglio in un giorno
  perdita_max_mensile_pct: 10       # perdita dall'inizio del mese
  chiudi_posizioni_al_blocco: true  # true = al blocco vende tutto; false = smette solo di comprare
  file_stato: data/stato_rischio.json   # qui l'app ricorda se è bloccata (anche se spegni il PC)

# --- Costi di trading (usati dal backtest) ---------------------
costi:
  commissione_per_azione: 0.005   # $ per azione (tipo IBKR "Fixed")
  commissione_minima: 1.0         # $ minimi per ordine
  commissione_max_pct: 1.0        # ...ma mai più dell'1% del valore dell'ordine
  slippage_pct: 0.05              # 0,05% di prezzo "peggiore" a ogni esecuzione

# --- Broker (Fase 4) -------------------------------------------
broker:
  modalita: paper              # SOLO "paper" (conto demo). Non cambiare finché non decidiamo insieme!
  host: 127.0.0.1              # 127.0.0.1 = il tuo stesso computer (TWS deve essere aperto lì)
  porta: 7497                  # 7497 = TWS demo, 4002 = IB Gateway demo (le porte del conto reale sono rifiutate)
  client_id: 1
  timeout_secondi: 15

# --- Esecuzione giornaliera (Fase 4) ---------------------------
esecuzione:
  margine_prezzo_pct: 1        # compro un po' meno azioni del calcolo, perché all'apertura il prezzo può essere più alto
  file_memoria: data/memoria_app.json        # cosa ricorda l'app tra un giorno e l'altro
  file_storico_valori: data/storico_valori.csv   # valore del conto ogni sera (serve per i limiti di perdita)
  file_registro: logs/operazioni.csv         # REGISTRO: ogni ordine con data, titolo, prezzo e motivo
  file_esecuzioni: logs/esecuzioni.csv       # i prezzi a cui gli ordini sono stati davvero eseguiti
