<title>Selettore di Reparto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Concetto: pulsantiera di macchina. Si sceglie un tasto alla volta (linea, momento, macchina)
   e il pannello si restringe fino al procedimento giusto, che poi si esegue fase per fase. */
:root {
  --bg: #E3E6E0;
  --panel: #F2F3EF;
  --key: #FCFCFA;
  --ink: #151916;
  --ink-2: #5A625C;
  --line: #C9CEC6;
  --accent: #1E5EA8;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCE7F5;
  --ok: #23924A;
  --warn: #C98F00;
  --crit: #CC3329;
  --crit-soft: #F7DDD9;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101311; --panel: #181C19; --key: #222723; --ink: #EBEEE9; --ink-2: #959E97; --line: #323934;
    --accent: #6EA4E6; --accent-ink: #08121E; --accent-soft: #1A2B40;
    --ok: #4CC777; --warn: #F0B52A; --crit: #FF6A5E; --crit-soft: #3B1C19; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101311; --panel: #181C19; --key: #222723; --ink: #EBEEE9; --ink-2: #959E97; --line: #323934;
  --accent: #6EA4E6; --accent-ink: #08121E; --accent-soft: #1A2B40;
  --ok: #4CC777; --warn: #F0B52A; --crit: #FF6A5E; --crit-soft: #3B1C19; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 500 16px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p, ol { margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); }
.wrap { max-width: 560px; margin-inline: auto; padding: 0 16px 40px; }

/* ---------- Testata ---------- */
.testata { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 14px 10px; display: grid; gap: 10px; }
.riga-t { display: flex; align-items: center; gap: 10px; }
.marchio { flex: 1; min-width: 0; }
.marchio h1 { font: 700 26px/1 var(--font-display); letter-spacing: .01em; text-transform: uppercase; }
.marchio span { display: block; font: 500 12px var(--font-mono); color: var(--ink-2); margin-top: 3px; }
.tondo { width: 42px; height: 42px; flex: none; border-radius: 50%; border: 1px solid var(--line); background: var(--key); box-shadow: 0 2px 0 var(--line); display: grid; place-items: center; font-weight: 700; font-size: 18px; }
.tondo:active { transform: translateY(2px); box-shadow: none; }
.tondo svg { width: 20px; height: 20px; }
.cerca { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; background: var(--key); }
.cerca:focus { outline: 3px solid var(--accent); outline-offset: 0; }

/* ---------- Stadi di selezione ---------- */
.stadio { display: grid; gap: 10px; padding-block: 14px; border-top: 1px solid var(--line); }
.stadio:first-child { border-top: 0; }
.stadio-h { display: flex; align-items: baseline; gap: 10px; }
.stadio-h .n { font: 700 12px var(--font-mono); color: var(--ink-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
.stadio-h h2 { font: 700 19px/1.1 var(--font-display); text-transform: uppercase; letter-spacing: .04em; flex: 1; }
.stadio-h .lnk { border: 0; background: none; padding: 4px 0; font-weight: 700; font-size: 14px; color: var(--accent); }
.stadio.fatto .stadio-h h2 { color: var(--ink-2); }
.scelto { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
.scelto b { font: 700 30px/1 var(--font-display); letter-spacing: .02em; }
.scelto span { color: var(--ink-2); font-size: 14px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.tasti { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.tasti.larghi { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.tasti.larghi .tasto { min-height: 64px; }
.tasto { position: relative; display: grid; gap: 4px; align-content: start; text-align: left; min-height: 84px; padding: 11px 12px 10px; border-radius: 14px; border: 1px solid var(--line); background: var(--key); box-shadow: 0 3px 0 var(--line); transition: transform .08s, box-shadow .08s; }
.tasto:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 0 0 var(--line); }
.tasto .big { font: 700 30px/1 var(--font-display); letter-spacing: .02em; }
.tasto .nome { font: 700 16px/1.15 var(--font-display); text-transform: uppercase; letter-spacing: .02em; overflow-wrap: anywhere; hyphens: auto; }
.tasto .sub { font-size: 12.5px; color: var(--ink-2); line-height: 1.3; }
.tasto .cnt { position: absolute; top: 9px; right: 10px; font: 700 12px var(--font-mono); color: var(--ink-2); }
.tasto[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 55%, var(--ink)); }
.tasto[aria-pressed="true"] .sub, .tasto[aria-pressed="true"] .cnt { color: var(--accent-ink); opacity: .85; }
.tasto:disabled { opacity: .38; cursor: default; box-shadow: 0 1px 0 var(--line); }
.tasto .barretta { height: 4px; border-radius: 2px; width: 28px; margin-top: 2px; }
.tasto.aggiungi { border-style: dashed; box-shadow: none; background: transparent; place-content: center; text-align: center; color: var(--ink-2); font-weight: 700; }

/* ---------- Risultato ---------- */
.esito { display: grid; gap: 8px; padding-block: 16px 6px; border-top: 2px solid var(--ink); }
.esito-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.esito-h h2 { font: 700 30px/1 var(--font-display); text-transform: uppercase; letter-spacing: .01em; }
.esito-h span { font: 500 13px var(--font-mono); color: var(--ink-2); text-align: right; }
.proc { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; width: 100%; text-align: left; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--key); }
.proc b { font-size: 17px; font-weight: 700; line-height: 1.25; }
.proc .meta { grid-column: 1; font-size: 13px; color: var(--ink-2); }
.proc .vai { grid-row: 1 / span 2; grid-column: 2; font: 700 15px var(--font-display); text-transform: uppercase; letter-spacing: .05em; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 9px 12px; }
.proc .reg { grid-column: 1; font-size: 13px; font-weight: 700; color: var(--crit); }
.vuoto { color: var(--ink-2); font-size: 15px; padding: 6px 0; }

/* ---------- Menu a tendina della linea ---------- */
.menus { display: grid; gap: 8px; padding-block: 14px; border-top: 2px solid var(--ink); }
.menu { border: 1px solid var(--line); border-radius: 14px; background: var(--key); overflow: hidden; }
.menu-h { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 10px 14px; border: 0; background: none; text-align: left; }
.menu-h .barretta { width: 5px; height: 26px; border-radius: 3px; flex: none; }
.menu-h .mt { flex: 1; min-width: 0; font: 700 18px/1.15 var(--font-display); text-transform: uppercase; letter-spacing: .03em; }
.menu-h .mc { font: 500 12.5px var(--font-mono); color: var(--ink); text-align: right; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu-h .mc.spento { color: var(--ink-2); }
.menu-h .chev { font-size: 16px; color: var(--ink-2); transition: transform .15s; }
.menu-h[aria-expanded="true"] .chev { transform: rotate(180deg); }
.menu-h[aria-expanded="true"] { background: var(--panel); border-bottom: 1px solid var(--line); }
.menu-b { display: grid; gap: 10px; padding: 12px 14px 14px; }
.prod-n { font: 700 24px/1.1 var(--font-display); }
.sotto { font: 700 12px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); margin-top: 4px; }
.regola-r { display: grid; gap: 2px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--crit); background: var(--crit-soft); color: var(--crit); }
.regola-r small { font-size: 12.5px; opacity: .85; }
.percorso { display: grid; gap: 6px; padding: 0; list-style: none; counter-reset: m; }
.percorso li { display: flex; align-items: baseline; gap: 10px; counter-increment: m; padding: 8px 10px; border-radius: 10px; background: var(--panel); }
.percorso li::before { content: counter(m, decimal-leading-zero); font: 700 12px var(--font-mono); color: var(--ink-2); }
.percorso li span { flex: 1; font-size: 15px; font-family: var(--font-body); font-weight: 600; }
.percorso li small { font: 500 12px var(--font-mono); color: var(--ink-2); }

/* ---------- Scheda linea ---------- */
.scheda { display: grid; gap: 12px; margin-top: 18px; padding: 14px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); }
.scheda h3 { font: 700 17px/1.1 var(--font-display); text-transform: uppercase; letter-spacing: .05em; }
.scheda-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.note { white-space: pre-wrap; font-size: 15px; }
.ap { display: grid; gap: 2px; width: 100%; text-align: left; padding: 10px 0; border: 0; border-top: 1px solid var(--line); background: none; }
.ap span { font-size: 15px; white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ap small { font: 500 12px var(--font-mono); color: var(--ink-2); }
.compone { display: grid; gap: 8px; }
.compone textarea { width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--key); }
.az { display: flex; flex-wrap: wrap; gap: 8px; }

.btn { border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; background: var(--key); font-weight: 700; font-size: 15px; box-shadow: 0 2px 0 var(--line); }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); box-shadow: none; }
.btn.danger { color: var(--crit); }
.btn:disabled { opacity: .45; cursor: default; }

/* ---------- Esecuzione ---------- */
.esec { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.esec-in { max-width: 620px; margin-inline: auto; min-height: 100%; padding: 12px 16px 24px; display: grid; grid-template-rows: auto auto 1fr auto; gap: 14px; }
.esec-t { display: flex; align-items: center; gap: 10px; }
.esec-t .tit { flex: 1; min-width: 0; }
.esec-t .tit b { display: block; font: 700 20px/1.1 var(--font-display); text-transform: uppercase; letter-spacing: .02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.esec-t .tit span { font: 500 12px var(--font-mono); color: var(--ink-2); }
.segm { display: flex; gap: 3px; }
.segm button { flex: 1; min-width: 0; height: 12px; padding: 0; border: 0; border-radius: 3px; background: var(--line); }
.segm button.c { background: color-mix(in srgb, var(--crit) 35%, var(--line)); }
.segm button.f { background: var(--ok); }
.segm button.r { background: var(--crit); }
.segm button[aria-current="step"] { outline: 2px solid var(--ink); outline-offset: 2px; }
.segm-l { display: flex; justify-content: space-between; font: 500 12.5px var(--font-mono); color: var(--ink-2); margin-top: 6px; }
.fase { align-self: start; display: grid; gap: 14px; padding: 20px 18px; border-radius: 18px; background: var(--key); border: 1px solid var(--line); }
.fase .eti { display: flex; align-items: center; gap: 8px; font: 700 13px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
.fase .testo { font: 600 clamp(21px, 5.6vw, 27px)/1.32 var(--font-body); text-wrap: pretty; }
.fase.critica { border: 2px solid var(--crit); }
.fase.critica .eti { color: var(--crit); }
.fase.regola { background: var(--crit-soft); border: 2px solid var(--crit); }
.fase.regola .eti, .fase.regola .testo { color: var(--crit); }
.fase.fine { text-align: center; justify-items: center; }
.fase .fatta { font: 700 13px var(--font-mono); color: var(--ok); }
.pedali { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.pedali button { min-height: 60px; border-radius: 16px; font: 700 20px var(--font-display); text-transform: uppercase; letter-spacing: .04em; border: 1px solid var(--line); background: var(--key); box-shadow: 0 3px 0 var(--line); }
.pedali button:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
.pedali .avanti { background: var(--ok); border-color: var(--ok); color: #FFFFFF; box-shadow: 0 3px 0 color-mix(in srgb, var(--ok) 55%, #000); }
.pedali .avanti.rosso { background: var(--crit); border-color: var(--crit); box-shadow: 0 3px 0 color-mix(in srgb, var(--crit) 55%, #000); }
.pedali button:disabled { opacity: .35; cursor: default; }
.elenco { display: grid; gap: 6px; padding: 0; list-style: none; }
.elenco button { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--key); font-size: 15px; }
.elenco .nn { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 700 12px var(--font-mono); background: var(--panel); border: 1px solid var(--line); }
.elenco .crit { color: var(--crit); font-weight: 700; }
.elenco .crit .nn { border-color: var(--crit); }
.elenco .ok .nn { background: var(--ok); border-color: var(--ok); color: #FFFFFF; }
.elenco .qui { border-color: var(--ink); }
.fonte { font-size: 13px; color: var(--ink-2); }

/* ---------- Riferimenti dal foglio: oggetti reali, con i loro colori veri ---------- */
.rif-w { display: grid; gap: 8px; padding-top: 12px; border-top: 1px dashed var(--line); }
.rif { display: flex; flex-wrap: wrap; gap: 10px; }
.vis { margin: 0; display: grid; gap: 6px; justify-items: center; align-content: start; padding: 10px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); max-width: 100%; min-width: 0; }
.vis.largo { flex: 1 1 100%; justify-items: stretch; }
.vis figcaption { font-size: 12.5px; color: var(--ink-2); text-align: center; line-height: 1.3; max-width: 220px; }
.torre { display: grid; gap: 3px; width: 34px; padding: 3px; background: #2A2D2F; border-radius: 6px; }
.lc { height: 17px; border-radius: 4px; }
.lc.rosso { background: #5C2622; } .lc.arancio { background: #5E3D14; } .lc.verde { background: #17402B; } .lc.blu { background: #1A2E52; }
.lc.rosso.fissa, .lc.rosso.lamp { background: #F0402F; box-shadow: 0 0 10px #F0402F; }
.lc.arancio.fissa, .lc.arancio.lamp { background: #FFA41F; box-shadow: 0 0 10px #FFA41F; }
.lc.verde.fissa, .lc.verde.lamp { background: #22C473; box-shadow: 0 0 10px #22C473; }
.lc.blu.fissa, .lc.blu.lamp { background: #3B8BFF; box-shadow: 0 0 10px #3B8BFF; }
.lc.lamp { animation: lampeggia 1s steps(1) infinite; }
@keyframes lampeggia { 50% { opacity: .2; box-shadow: none; } }
.torre .base { height: 10px; background: #111314; border-radius: 0 0 4px 4px; }
.hmi-r { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; }
.hmi-r .fr { color: var(--ink-2); font-weight: 700; }
.hmi { font: 700 12.5px/1.15 var(--font-mono); padding: 10px 12px; min-width: 92px; text-align: center; color: #FFFFFF; letter-spacing: .02em; }
.hmi.azz { background: #9CCBEB; color: #123049; } .hmi.blu { background: #1C6FD0; } .hmi.verde { background: #2E9E44; }
.msg { font: 700 13px/1.4 var(--font-mono); padding: 10px 12px; letter-spacing: .02em; overflow-wrap: anywhere; }
.msg.nero { background: #0E1412; color: #71D9CB; } .msg.teal { background: #5DB9BF; color: #0E3A3F; } .msg.verde { background: #43AE5A; color: #0E3216; }
.pls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.pl { display: grid; justify-items: center; gap: 5px; padding: 5px; border-radius: 12px; border: 3px solid transparent; }
.pl.evid { border-color: #2E9E44; }
.tg { background: #151515; color: #EEEEEE; font: 700 9.5px/1.15 var(--font-mono); padding: 4px 6px; text-align: center; max-width: 80px; text-transform: uppercase; }
.bt { width: 40px; height: 40px; border-radius: 50%; border: 3px solid #C9CDD1; background: radial-gradient(circle at 40% 35%, #A3ABB2, #485057); }
.bt.giallo { background: radial-gradient(circle at 40% 35%, #FFF6C2, #F2B705); box-shadow: 0 0 12px rgb(242 183 5 / .55); }
.bt.verde { background: radial-gradient(circle at 40% 35%, #A8F5C8, #1FB36A); box-shadow: 0 0 12px rgb(31 179 106 / .5); }
.bt.bianco { background: radial-gradient(circle at 40% 35%, #FFFFFF, #CFD3D6); }
.bt.blu { background: radial-gradient(circle at 40% 35%, #8FC1FF, #1F63D6); }
.sig { font: 700 10.5px var(--font-mono); color: var(--ink-2); }
.mano { width: 112px; height: 112px; }
.mano .ghiera { fill: #9EA6AC; } .mano .quadrante { fill: #F6F6F2; }
.mano .tacche line { stroke: #222222; stroke-width: 1.6; } .mano .tacche text { font: 700 8px var(--font-mono); fill: #222222; text-anchor: middle; }
.mano .unita { font: 600 8px var(--font-mono); fill: #555555; text-anchor: middle; }
.mano .lancetta { stroke: #D2342B; stroke-width: 2.4; stroke-linecap: round; } .mano .perno { fill: #222222; }
.mon { width: 236px; max-width: 100%; background: #CCD9E8; color: #10243B; border: 3px solid #2E3236; font: 500 12px/1.3 var(--font-body); display: grid; gap: 6px; padding-bottom: 6px; }
.mon-t { display: flex; align-items: center; gap: 8px; background: #B4C7DC; padding: 4px 6px; }
.mon-t span { font-size: 10px; border: 1px solid #10243B; padding: 0 4px; } .mon-t b { flex: 1; text-align: center; font-size: 15px; letter-spacing: .04em; }
.mon p { padding: 0 8px; } .mon-c { display: grid; gap: 4px; padding: 0 12px; }
.mon-c span { display: flex; align-items: center; gap: 6px; } .mon-c i { width: 12px; height: 12px; border: 1px solid #10243B; background: #FFFFFF; display: inline-grid; place-items: center; font-style: normal; font-size: 10px; }
.mon-c i.x::after { content: "✓"; color: #10243B; }
.mon-b { display: flex; gap: 4px; padding: 0 6px; flex-wrap: wrap; } .mon-b span { flex: 1; text-align: center; border: 1px solid #10243B; background: #E6EDF5; padding: 3px 2px; font-size: 11px; border-radius: 3px; }
.mon-b span.evid { outline: 2px solid #D2342B; outline-offset: 1px; border-radius: 50%; }
.mon small { padding: 0 8px; font-size: 11px; }
.dpi { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.ic-d { display: grid; justify-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; color: var(--ink-2); width: 62px; text-align: center; }
.ic-d svg { width: 44px; height: 44px; }
.ic-d .obbligo { fill: #1F63B5; } .ic-d .obbligo-g { fill: none; stroke: #FFFFFF; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.ic-d .pericolo { fill: #F5C400; stroke: #151515; stroke-width: 2; stroke-linejoin: round; } .ic-d .pericolo-g { fill: none; stroke: #151515; stroke-width: 2.4; stroke-linecap: round; }
.band { width: 104px; height: 38px; background: linear-gradient(#AEB9C4, #8D9AA7); border-radius: 3px; display: grid; place-items: center; }
.band span { width: 34px; height: 30px; display: grid; place-items: center; background: #E1E7EC; color: #26313B; font: 700 9px var(--font-mono); border: 1px solid #6A7682; }
.band.nera span { background: #121212; color: #D9D9D9; }
.peso { display: grid; grid-template-columns: auto auto; align-items: center; gap: 6px 10px; padding: 10px; background: #1B3D8C; color: #FFFFFF; font: 700 12px var(--font-mono); }
.peso .auto { grid-column: 1 / -1; background: #2E9E44; text-align: center; padding: 4px; }
.peso .lbl { color: #F2C200; font-size: 10.5px; } .peso .val { background: #1C6FD0; padding: 5px 10px; text-align: right; font-size: 15px; }
.timer { font: 700 26px/1 var(--font-display); padding: 6px 4px; }
.ha-rif { display: block; margin-top: 4px; font: 500 12px var(--font-mono); color: var(--ink-2); }

/* ---------- Fogli ---------- */
.velo { position: fixed; inset: 0; z-index: 60; background: rgb(0 0 0 / .45); display: flex; align-items: flex-end; justify-content: center; }
.foglio { width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; background: var(--bg); border-radius: 20px 20px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.foglio h3 { font: 700 24px/1.1 var(--font-display); text-transform: uppercase; letter-spacing: .02em; }
.campo { display: grid; gap: 6px; }
.campo label, .campo .lbl { font-weight: 700; font-size: 14px; }
.campo small { color: var(--ink-2); font-size: 13px; }
.campo input, .campo select, .campo textarea { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--key); }
.campo textarea { resize: vertical; min-height: 60px; line-height: 1.45; }
.due { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 12px; }
.fasi { display: grid; gap: 8px; }
.fase-e { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; align-items: start; }
.fase-e .n { width: 28px; height: 28px; margin-top: 6px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); background: var(--key); font: 700 12px var(--font-mono); }
.fase-e.crit .n { background: var(--crit); border-color: var(--crit); color: #FFFFFF; }
.fase-e textarea { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; background: var(--key); resize: vertical; }
.fase-e.crit textarea { color: var(--crit); font-weight: 700; }
.fase-az { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
.fase-az button { border: 1px solid var(--line); border-radius: 8px; padding: 3px 10px; font-size: 12.5px; font-weight: 700; background: var(--panel); color: var(--ink-2); }
.fase-az button[aria-pressed="true"] { background: var(--crit); border-color: var(--crit); color: #FFFFFF; }
.fase-az button:disabled { opacity: .35; cursor: default; }
.conferma { background: var(--crit-soft); color: var(--crit); border-radius: 14px; padding: 12px 14px; display: grid; gap: 10px; font-weight: 600; font-size: 15px; }
.conferma div { display: flex; gap: 8px; flex-wrap: wrap; }
.f-az { display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; }
.f-az div { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }

.avviso { margin-top: 24px; padding: 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); display: grid; gap: 6px; }
.avviso p { color: var(--ink-2); font-size: 15px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 80; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 12px; font-weight: 700; font-size: 15px; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="wrap">
  <header class="testata">
    <div class="riga-t">
      <div class="marchio"><h1>Selettore</h1><span id="sottotitolo">Scegli, restringi, esegui</span></div>
      <button class="tondo" type="button" data-act="appunti" aria-label="Tutti gli appunti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h10l4 4v12H5z"/><path d="M15 4v4h4M8 13h8M8 17h5"/></svg></button>
      <button class="tondo" type="button" data-act="nuova-linea" id="btn-nuova" aria-label="Nuova linea" hidden>+</button>
    </div>
    <input class="cerca" id="cerca" type="search" placeholder="Cerca in tutte le linee: macchina, parola, codice…" aria-label="Cerca" autocomplete="off">
  </header>
  <main id="app"><p class="vuoto" style="padding-top:20px">Accendo il pannello…</p></main>
</div>
<div id="esec-root"></div>
<div id="sheet-root"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function () {
  "use strict";
  /* ---------- Vocabolario del reparto ---------- */
  /* Momenti/argomenti: ogni procedimento ne ha uno e finisce nel menu omonimo della linea */
  const MOMENTI = [
    ["sicurezza", "Sicurezza e DPI", "#CC3329", "DPI da indossare, rischi della linea, cosa non fare mai."],
    ["avvio", "Avvio linea", "#23924A", "Controlli e passaggi per far partire la linea a inizio turno."],
    ["produzione", "Produzione", "#1E5EA8", "Velocità, dosaggi, regolazioni durante la marcia."],
    ["cambio", "Cambio vasca e formato", "#C98F00", "Concatenamento, cambio vasca, cambio formato o prodotto."],
    ["lavaggio", "Lavaggio e sterilizzazione", "#5468D4", "Che lavaggio si fa, quando, quanto dura (CIP, sterilizzazione)."],
    ["reclage", "Reclage", "#D2602A", "Come si fa il reclage su questa linea."],
    ["pulizia", "Pulizia linea", "#0E8BA6", "Cosa pulire, con cosa e ogni quanto."],
    ["qualita", "Controlli qualità", "#2E8C7A", "Pesate, limiti di legge, controllo etichette e lotti."],
    ["fine", "Fine turno e consegne", "#8150C9", "Chiusura, consegne al turno dopo, cosa lasciare in ordine."]
  ];
  const MOM = Object.fromEntries(MOMENTI.map((m) => [m[0], m]));
  const STAZ_BASE = ["Alimentatori", "Riempitrice", "Etichettatrice", "Scatolatrice", "Pellettizzatore"];

  const S = { db: null, ready: false, canWrite: true, lines: [], proc: [], appunti: [], okL: false, err: false,
    linea: "", q: "", run: "" };

  /* Selezione, spunte e posizione di esecuzione: comodità personali, restano su questo dispositivo */
  const leggi = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || "null") || d; } catch (e) { return d; } };
  const scrivi = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  let SP = leggi("spunte", {}), POS = leggi("posizione", {}), APERTI = leggi("menu-aperti", {});
  Object.assign(S, leggi("selezione", {}));
  const salvaSel = () => scrivi("selezione", { linea: S.linea });

  const $ = (s, r) => (r || document).querySelector(s);
  const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const nat = (a, b) => String(a || "").localeCompare(String(b || ""), "it", { numeric: true });
  const sigla = (l) => (l && (l.nome || String(l.codice || "").replace(/^L\.\s*/i, ""))) || "?";
  const stazioni = (l) => (l && Array.isArray(l.stazioni) && l.stazioni.length ? l.stazioni : STAZ_BASE);
  const lineaDi = (codice) => S.lines.find((l) => l.codice === codice);
  const procDi = (l) => S.proc.filter((p) => p.linea === l.codice);
  const apDi = (l) => S.appunti.filter((a) => a.linea === l.codice);
  const momentoDi = (p) => {
    if (p.momento && MOM[p.momento]) return p.momento;
    const t = String(p.titolo || "").toLowerCase();
    if (/sicurezz|dpi\b/.test(t)) return "sicurezza";
    if (/pesat|pesi\b|qualit|controll/.test(t)) return "qualita";
    if (/reclage/.test(t)) return "reclage";
    if (/lavagg|cip/.test(t)) return "lavaggio";
    if (/concaten|cambio/.test(t)) return "cambio";
    if (/pulizi/.test(t)) return "pulizia";
    if (/avvio|partenz/.test(t)) return "avvio";
    if (/fine turno|chiusura|consegn/.test(t)) return "fine";
    return "produzione";
  };
  const dfmt = new Intl.DateTimeFormat("it-IT", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  const quando = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : dfmt.format(d); };
  const ora = () => new Date().toISOString();
  function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (el.hidden = true), 2300); }
  function errore(e, cosa) {
    const c = e && e.code;
    if (c === "permission_denied" || c === "not_granted") return cosa + ": non hai il permesso di modifica";
    if (c === "unauthenticated" || c === "signed_out") return cosa + ": accedi a claude.ai e riprova";
    return cosa + ": controlla la connessione e riprova";
  }

  /* ---------- Pannello ---------- */
  const tastoLinea = (x) => { const n = procDi(x).length, pn = x.prodotto && x.prodotto.nome;
    return `<button class="tasto" type="button" data-linea="${esc(x.codice)}"><span class="cnt">${n || ""}</span><span class="big">${esc(sigla(x))}</span><span class="sub">${esc(pn || x.codice)}</span></button>`; };
  const MENU = ["prodotto", "sicurezza", "avvio", "produzione", "cambio", "lavaggio", "reclage", "pulizia", "qualita", "fine", "macchine", "appunti"];
  function vPannello() {
    if (!S.lines.length) {
      return `<div class="avviso"><b>Nessuna linea sul pannello.</b><p>Aggiungi la prima linea: poi potrai scriverci sopra procedimenti e appunti.</p>${S.canWrite ? '<div class="az"><button class="btn primary" type="button" data-act="nuova-linea">+ Aggiungi linea</button></div>' : ""}</div>`;
    }
    const l = lineaDi(S.linea);
    if (!l) {
      S.linea = "";
      return `<section class="stadio"><div class="stadio-h"><h2>Su che linea sei?</h2></div><div class="tasti">${S.lines.map(tastoLinea).join("")}${S.canWrite ? '<button class="tasto aggiungi" type="button" data-act="nuova-linea">+ Linea</button>' : ""}</div></section>`;
    }
    const pn = l.prodotto && l.prodotto.nome, tuttiAperti = MENU.every((k) => APERTI[k]);
    return `<section class="stadio fatto"><div class="stadio-h"><h2>Linea</h2><button class="lnk" type="button" data-act="cambia-linea">Cambia linea</button></div>
      <div class="scelto"><b>${esc(sigla(l))}</b><span>${esc([l.codice, pn || "prodotto da indicare"].join(" · "))}</span>${S.canWrite ? '<button class="btn" type="button" data-act="mod-linea">Modifica</button>' : ""}</div>
      ${l.note ? `<p class="note">${esc(l.note)}</p>` : ""}</section>
      <section class="menus"><div class="stadio-h"><h2>Tutto su ${esc(sigla(l))}</h2><button class="lnk" type="button" data-act="tutti-menu">${tuttiAperti ? "Chiudi tutti" : "Apri tutti"}</button></div>
      ${MENU.map((k) => menu(l, k)).join("")}</section>`;
  }
  function menu(l, k) {
    const aperto = !!APERTI[k], sez = l.sezioni || {}, testo = sez[k] || "", w = S.canWrite;
    const blocNote = (hint) => (testo ? `<p class="note">${esc(testo)}</p>` : `<p class="vuoto">${esc(hint)}</p>`);
    const btnNote = w ? `<button class="btn" type="button" data-act="note-sez" data-k="${k}">${testo ? "Modifica note" : "+ Scrivi note"}</button>` : "";
    let titolo, colore, conto, corpo;
    if (k === "prodotto") {
      const pr = l.prodotto || {};
      titolo = "Prodotto"; colore = "var(--ink)"; conto = pr.nome || "da indicare";
      corpo = `${pr.nome ? `<p class="prod-n">${esc(pr.nome)}</p>` : '<p class="vuoto">Nessun prodotto indicato per questa linea.</p>'}${pr.descrizione ? `<p class="note">${esc(pr.descrizione)}</p>` : ""}
        ${testo ? `<p class="note">${esc(testo)}</p>` : '<p class="vuoto">Formato, codici, viscosità, particolarità del prodotto.</p>'}
        ${w ? '<div class="az"><button class="btn" type="button" data-act="mod-prodotto">Modifica prodotto</button></div>' : ""}`;
    } else if (k === "macchine") {
      const st = stazioni(l);
      titolo = "Macchine"; colore = "var(--ink-2)"; conto = st.length + " in linea";
      corpo = `<ol class="percorso">${st.map((x) => { const n = procDi(l).filter((p) => p.stazione === x).length; return `<li><span class="mono">${esc(x)}</span>${n ? `<small>${n} proc.</small>` : ""}</li>`; }).join("")}</ol>
        ${blocNote("Particolarità delle macchine, regolazioni, ricambi.")}<div class="az">${btnNote}${w ? '<button class="btn" type="button" data-act="mod-linea">Cambia macchine</button>' : ""}</div>`;
    } else if (k === "appunti") {
      const aps = apDi(l);
      titolo = "Appunti"; colore = "var(--accent)"; conto = aps.length ? String(aps.length) : "nessuno";
      corpo = `${w ? `<div class="compone"><textarea id="ap-nuovo" placeholder="Una cosa vista in turno su ${esc(sigla(l))}, un promemoria per chi arriva dopo…" aria-label="Nuovo appunto"></textarea><div class="az"><button class="btn primary" type="button" data-act="salva-ap">Salva appunto</button></div></div>` : ""}
        <div>${aps.length ? aps.map((a) => rigaAp(a)).join("") : '<p class="vuoto">Nessun appunto su questa linea.</p>'}</div>`;
    } else {
      const m = MOM[k], ps = procDi(l).filter((p) => momentoDi(p) === k).sort((a, b) => nat(a.titolo, b.titolo));
      titolo = m[1]; colore = m[2];
      let extra = "";
      if (k === "sicurezza") {
        const reg = procDi(l).filter((p) => p.regola && momentoDi(p) !== "sicurezza");
        if (reg.length) extra = `<p class="sotto">Regole critiche degli altri procedimenti</p>${reg.map((p) => `<button class="regola-r" type="button" data-proc="${esc(p.id)}"><b>⚠ ${esc(p.regola)}</b><small>${esc(p.titolo)}</small></button>`).join("")}`;
        conto = [ps.length && ps.length + " proc.", reg.length && reg.length + (reg.length === 1 ? " regola" : " regole")].filter(Boolean).join(" · ");
      } else conto = ps.length ? ps.length + " proc." : "";
      conto = conto || (testo ? "note" : "vuoto");
      corpo = `${blocNote(m[3])}${ps.map((p) => rigaProc(p)).join("")}${extra}
        ${w ? `<div class="az">${btnNote}<button class="btn" type="button" data-act="nuovo-proc" data-k="${k}">+ Procedimento</button></div>` : ""}`;
    }
    const vuoto = conto === "vuoto" || conto === "nessuno" || conto === "da indicare";
    return `<section class="menu"><button class="menu-h" type="button" data-menu="${k}" aria-expanded="${aperto}"><span class="barretta" style="background:${colore}"></span><span class="mt">${esc(titolo)}</span><span class="mc ${vuoto ? "spento" : ""}">${esc(conto)}</span><span class="chev" aria-hidden="true">▾</span></button>${aperto ? `<div class="menu-b">${corpo}</div>` : ""}</section>`;
  }
  function rigaProc(p, conLinea) {
    const m = MOM[momentoDi(p)], n = (p.passi || []).length, fatti = (SP[p.id] || []).filter((i) => i < n).length;
    const meta = [conLinea ? p.linea : "", conLinea ? m[1] : "", p.stazione, n ? (fatti ? `${fatti}/${n} fasi` : `${n} fasi`) : "fasi da scrivere"].filter(Boolean).join(" · ");
    return `<button class="proc" type="button" data-proc="${esc(p.id)}"><b>${esc(p.titolo || "Senza titolo")}</b><span class="vai">${fatti && fatti < n ? "Riprendi" : "Esegui"}</span><span class="meta">${esc(meta)}</span>${p.regola ? '<span class="reg">⚠ Ha una regola critica</span>' : ""}</button>`;
  }
  const rigaAp = (a, conLinea) => `<button class="ap" type="button" data-ap="${esc(a.id)}"><span>${esc(a.testo)}</span><small>${esc([conLinea ? a.linea : "", quando(a.creato)].filter(Boolean).join(" · "))}</small></button>`;

  /* ---------- Ricerca ---------- */
  function vRicerca() {
    const q = S.q.trim().toLowerCase();
    const has = (arr) => arr.join(" ").toLowerCase().includes(q);
    const L = S.lines.filter((l) => has([l.codice, l.nome, l.prodotto && l.prodotto.nome, l.prodotto && l.prodotto.descrizione, l.note, stazioni(l).join(" "), Object.values(l.sezioni || {}).join(" ")]));
    const P = S.proc.filter((p) => has([p.titolo, p.regola, p.stazione, p.fonte, p.linea, MOM[momentoDi(p)][1], (p.passi || []).map((x) => x.t).join(" ")]));
    const A = S.appunti.filter((a) => has([a.testo, a.linea]));
    const tot = L.length + P.length + A.length;
    let h = `<section class="esito"><div class="esito-h"><h2>${tot} ${tot === 1 ? "risultato" : "risultati"}</h2><span>“${esc(S.q.trim())}”</span></div>`;
    if (!tot) h += `<p class="vuoto">Niente contiene questa parola. Prova con il nome di una macchina o un codice.</p>`;
    if (L.length) h += `<div class="tasti">${L.map(tastoLinea).join("")}</div>`;
    h += P.map((p) => rigaProc(p, true)).join("");
    if (A.length) h += `<div>${A.map((a) => rigaAp(a, true)).join("")}</div>`;
    return h + "</section>";
  }

  /* ---------- Riferimenti visivi (come sul foglio plastificato) ---------- */
  const LUCI = [["rosso", "rossa"], ["arancio", "gialla"], ["verde", "verde"], ["blu", "blu"]];
  const ICONE = {
    occhiali: ['obbligo', '<circle cx="13" cy="21" r="5"/><circle cx="27" cy="21" r="5"/><path d="M18 21h4M8 19l-2-3M32 19l2-3"/>', "Occhiali"],
    guanti: ['obbligo', '<path d="M14 30V15a1.6 1.6 0 0 1 3.2 0v7M17.2 21V11.5a1.6 1.6 0 0 1 3.2 0V21M20.4 21v-8.5a1.6 1.6 0 0 1 3.2 0V22M23.6 22v-6a1.6 1.6 0 0 1 3.2 0V27c0 3-2 5-5 5h-3c-2 0-3-1-4-2l-4-5a1.6 1.6 0 0 1 2.4-2l2 2"/>', "Guanti"],
    maschera: ['obbligo', '<path d="M11 18c3-3 15-3 18 0v5c0 4-4 7-9 7s-9-3-9-7z"/><path d="M11 20H7M29 20h4M16 24h8"/>', "Maschera"],
    caldo: ['pericolo', '<path d="M15 27c-2-3 2-5 0-8M20 27c-2-3 2-5 0-8M25 27c-2-3 2-5 0-8"/>', "Rischio termico"],
    scivoloso: ['pericolo', '<path d="M20 15v8M20 27v.5"/>', "Scivoloso"]
  };
  function vis(v) {
    const cap = v.cap ? `<figcaption>${esc(v.cap)}</figcaption>` : "";
    switch (v.k) {
      case "torre": { const on = v.on || {};
        return `<figure class="vis"><div class="torre" role="img" aria-label="${esc(v.cap || "Colonna luminosa")}">${LUCI.map(([c]) => `<span class="lc ${c} ${on[c] || ""}"></span>`).join("")}<span class="base"></span></div>${cap}</figure>`; }
      case "hmi": return `<figure class="vis"><div class="hmi-r">${v.tasti.map(([t, c], i) => (i ? '<span class="fr" aria-hidden="true">›</span>' : "") + `<span class="hmi ${c}">${esc(t)}</span>`).join("")}</div>${cap}</figure>`;
      case "msg": return `<figure class="vis largo"><div class="msg ${v.c || "nero"}">${esc(v.t)}</div>${cap}</figure>`;
      case "pulsanti": return `<figure class="vis"><div class="pls">${v.tasti.map((b) => `<span class="pl ${b.evid ? "evid" : ""}"><span class="tg">${esc(b.t)}</span><span class="bt ${b.luce || ""}"></span>${b.sig ? `<span class="sig">${esc(b.sig)}</span>` : ""}</span>`).join("")}</div>${cap}</figure>`;
      case "manometro": {
        const max = v.max || 6, val = Math.max(0, Math.min(max, +v.val || 0)), cx = 50, cy = 52, r = 38;
        const pt = (x, rr) => { const a = (135 + 270 * x / max) * Math.PI / 180; return [cx + rr * Math.cos(a), cy + rr * Math.sin(a)]; };
        let tacche = "";
        for (let i = 0; i <= max; i++) { const [x1, y1] = pt(i, r - 2), [x2, y2] = pt(i, r - 9), [tx, ty] = pt(i, r - 17); tacche += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/><text x="${tx.toFixed(1)}" y="${(ty + 3).toFixed(1)}">${i}</text>`; }
        const [nx, ny] = pt(val, r - 8);
        return `<figure class="vis"><svg class="mano" viewBox="0 0 100 100" role="img" aria-label="Manometro a ${val} bar"><circle cx="50" cy="52" r="44" class="ghiera"/><circle cx="50" cy="52" r="40" class="quadrante"/><g class="tacche">${tacche}</g><text x="50" y="80" class="unita">bar</text><line x1="50" y1="52" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" class="lancetta"/><circle cx="50" cy="52" r="4" class="perno"/></svg>${cap}</figure>`;
      }
      case "monitor": return `<figure class="vis"><div class="mon"><div class="mon-t"><span>Menu</span><b>${esc(v.titolo)}</b></div>${v.sotto ? `<p>${esc(v.sotto)}</p>` : ""}<div class="mon-c">${(v.check || []).map(([l, c]) => `<span><i class="${c ? "x" : ""}"></i>${esc(l)}</span>`).join("")}</div><div class="mon-b">${(v.tasti || []).map((t) => `<span class="${t === v.evid ? "evid" : ""}">${esc(t)}</span>`).join("")}</div>${v.stato ? `<small>Stato: ${esc(v.stato)}</small>` : ""}</div>${cap}</figure>`;
      case "dpi": return `<figure class="vis"><div class="dpi">${v.voci.map((k) => { const ic = ICONE[k]; if (!ic) return ""; return `<span class="ic-d"><svg viewBox="0 0 40 40" aria-hidden="true">${ic[0] === "obbligo" ? '<circle cx="20" cy="20" r="18" class="obbligo"/>' : '<path d="M20 4 37 34H3z" class="pericolo"/>'}<g class="${ic[0]}-g">${ic[1]}</g></svg>${esc(ic[2])}</span>`; }).join("")}</div>${cap}</figure>`;
      case "bandelletta": return `<figure class="vis"><div class="band ${v.nera ? "nera" : ""}" role="img" aria-label="Bandelletta termica ${v.nera ? "nera" : "da annerire"}"><span>${esc(v.t || "82°C")}</span></div>${cap}</figure>`;
      case "peso": return `<figure class="vis"><div class="peso"><span class="auto">AUTOMATICO</span><span class="lbl">REGOLAZIONE PESO</span><span class="val">${esc(v.peso)}</span><span class="lbl">VELOCITÀ MACCHINA</span><span class="val">${esc(v.vel)}</span></div>${cap}</figure>`;
      case "timer": return `<figure class="vis"><div class="timer">${esc(v.t)}</div>${cap}</figure>`;
      default: return "";
    }
  }

  /* ---------- Esecuzione fase per fase ---------- */
  const carte = (p) => (p.regola ? [{ regola: true, t: p.regola }] : []).concat((p.passi || []).map((s, i) => ({ t: s.t, a: s.a, v: s.v, i })));
  function vEsec(p) {
    const C = carte(p), passi = p.passi || [], fatti = (SP[p.id] || []).filter((i) => i < passi.length);
    let pos = Math.min(POS[p.id] || 0, C.length);
    const fine = pos >= C.length, c = C[pos];
    const seg = C.map((x, k) => `<button type="button" data-vai="${k}" class="${x.regola ? "r" : fatti.includes(x.i) ? "f" : x.a ? "c" : ""}" ${k === pos ? 'aria-current="step"' : ""} aria-label="${x.regola ? "Regola" : "Fase " + (x.i + 1)}"></button>`).join("");
    let carta;
    if (!passi.length) carta = `<div class="fase"><span class="eti">Fasi</span><p class="testo">Le fasi di questo procedimento non sono ancora scritte.</p>${p.regola ? `<p style="color:var(--crit);font-weight:700">⚠ ${esc(p.regola)}</p>` : ""}${S.canWrite ? '<div class="az"><button class="btn primary" type="button" data-act="mod-proc">Scrivi le fasi</button></div>' : ""}</div>`;
    else if (fine) carta = `<div class="fase fine"><span class="eti">Fine</span><p class="testo">${fatti.length === passi.length ? "Tutte le fasi fatte." : `${fatti.length} fasi su ${passi.length} segnate come fatte.`}</p><div class="az"><button class="btn" type="button" data-act="ricomincia">Ricomincia da capo</button><button class="btn primary" type="button" data-act="chiudi-esec">Torna al pannello</button></div></div>`;
    else if (c.regola) carta = `<div class="fase regola"><span class="eti">⚠ Prima di iniziare · regola</span><p class="testo">${esc(c.t)}</p></div>`;
    else carta = `<div class="fase ${c.a ? "critica" : ""}"><span class="eti">${c.a ? "⚠ " : ""}Fase ${c.i + 1} di ${passi.length}${c.a ? " · attenzione" : ""}</span><p class="testo">${esc(c.t)}</p>${c.v && c.v.length ? `<div class="rif-w"><span class="eti">Sul foglio</span><div class="rif">${c.v.map(vis).join("")}</div></div>` : ""}${fatti.includes(c.i) ? '<span class="fatta">✓ Già segnata come fatta</span>' : ""}</div>`;
    const pedali = passi.length && !fine ? `<div class="pedali"><button type="button" data-act="prec" ${pos ? "" : "disabled"}>Indietro</button><button type="button" class="avanti ${c.regola ? "rosso" : ""}" data-act="avanti">${c.regola ? "Ho capito" : pos === C.length - 1 ? "Fatto, finito" : "Fatto, avanti"}</button></div>` : "<span></span>";
    const elenco = S.elenco ? `<ol class="elenco">${C.map((x, k) => `<li><button type="button" data-vai="${k}" class="${x.regola || x.a ? "crit" : ""} ${!x.regola && fatti.includes(x.i) ? "ok" : ""} ${k === pos ? "qui" : ""}"><span class="nn">${x.regola ? "!" : !x.regola && fatti.includes(x.i) ? "✓" : x.i + 1}</span><span>${esc(x.t)}</span></button></li>`).join("")}</ol>` : "";
    return `<div class="esec" id="esec" role="dialog" aria-modal="true" aria-label="${esc(p.titolo)}"><div class="esec-in">
      <div class="esec-t"><button class="tondo" type="button" data-act="chiudi-esec" aria-label="Torna al pannello">←</button><div class="tit"><b>${esc(p.titolo || "Senza titolo")}</b><span>${esc([p.linea, MOM[momentoDi(p)][1], p.stazione].filter(Boolean).join(" · "))}</span></div>${S.canWrite ? '<button class="tondo" type="button" data-act="mod-proc" aria-label="Modifica procedimento">✎</button>' : ""}</div>
      ${passi.length ? `<div><div class="segm">${seg}</div><div class="segm-l"><span>${fatti.length}/${passi.length} fatte</span><span>${passi.filter((x) => x.a).length} critiche</span></div></div>` : "<span></span>"}
      ${carta}
      <div style="display:grid;gap:14px">${pedali}
        <div class="az"><button class="btn" type="button" data-act="elenco">${S.elenco ? "Nascondi elenco" : "Tutte le fasi"}</button><button class="btn" type="button" data-act="copia-proc">Copia testo</button>${S.canWrite ? '<button class="btn" type="button" data-act="dup-proc">Duplica</button>' : ""}${fatti.length ? '<button class="btn" type="button" data-act="ricomincia">Azzera</button>' : ""}</div>
        ${elenco}${p.fonte ? `<p class="fonte">${esc(p.fonte)}</p>` : ""}</div>
    </div></div>`;
  }
  function renderEsec() {
    const root = $("#esec-root"), p = S.run && S.proc.find((x) => x.id === S.run);
    if (!p) { if (root.innerHTML) { root.innerHTML = ""; document.body.style.overflow = ""; } S.run = ""; return; }
    const y = $("#esec") ? $("#esec").scrollTop : 0;
    root.innerHTML = vEsec(p);
    $("#esec").scrollTop = y;
    document.body.style.overflow = "hidden";
  }
  function apriEsec(id) { S.run = id; S.elenco = false; renderEsec(); const b = $("#esec .tondo"); if (b) b.focus({ preventScroll: true }); }
  function muovi(delta, segna) {
    const p = S.proc.find((x) => x.id === S.run); if (!p) return;
    const C = carte(p), pos = Math.min(POS[p.id] || 0, C.length), c = C[pos];
    if (segna && c && !c.regola) { const arr = SP[p.id] || []; if (!arr.includes(c.i)) SP[p.id] = arr.concat(c.i); scrivi("spunte", SP); }
    POS[p.id] = Math.max(0, Math.min(C.length, pos + delta)); scrivi("posizione", POS);
    renderEsec(); $("#esec").scrollTop = 0;
  }

  /* ---------- Render ---------- */
  function render() {
    $("#btn-nuova").hidden = !(S.canWrite && S.db);
    if (!S.ready) return;
    const app = $("#app");
    if (!S.db) { app.innerHTML = `<div class="avviso"><b>Da qui non riesco ad aprire i dati.</b><p>Succede quando la pagina si apre come anteprima. Aprila dal link su claude.ai con il tuo account per vedere le linee e modificarle.</p></div>`; return; }
    if (S.err) { app.innerHTML = `<div class="avviso"><b>Non riesco a leggere i dati.</b><p>Ricarica la pagina tra qualche secondo.</p></div>`; return; }
    if (!S.okL) { app.innerHTML = '<p class="vuoto" style="padding-top:20px">Carico le linee…</p>'; return; }
    const bozza = $("#ap-nuovo") ? $("#ap-nuovo").value : null;
    app.innerHTML = S.q.trim() ? vRicerca() : vPannello();
    if (bozza != null && $("#ap-nuovo")) $("#ap-nuovo").value = bozza;
    $("#sottotitolo").textContent = `${S.lines.length} linee · ${S.proc.length} procedimenti`;
    renderEsec();
  }

  /* ---------- Fogli di modifica ---------- */
  let chiudiFoglio = null;
  function foglio(html, monta) {
    const root = $("#sheet-root");
    root.innerHTML = `<div class="velo" id="velo"><div class="foglio" id="foglio" role="dialog" aria-modal="true">${html}</div></div>`;
    const velo = $("#velo");
    chiudiFoglio = () => { root.innerHTML = ""; chiudiFoglio = null; render(); };
    velo.addEventListener("click", (e) => { if (e.target === velo) chiudiFoglio(); });
    if (monta) monta($("#foglio"));
    const primo = $("#foglio input, #foglio textarea, #foglio select"); if (primo) primo.focus({ preventScroll: true });
  }
  const optLinee = (sel) => S.lines.map((l) => `<option value="${esc(l.codice)}" ${l.codice === sel ? "selected" : ""}>${esc(l.codice)}${l.prodotto && l.prodotto.nome ? " · " + esc(l.prodotto.nome) : ""}</option>`).join("");
  function bloccaBottoni(on) { document.querySelectorAll("#foglio button").forEach((b) => (b.disabled = on)); }
  function confermaElimina(box, testo, azione) {
    box.innerHTML = `<div class="conferma"><span>${esc(testo)}</span><div><button class="btn danger" type="button" id="si-elimina">Sì, elimina</button><button class="btn" type="button" id="no-elimina">Annulla</button></div></div>`;
    $("#no-elimina").onclick = () => (box.innerHTML = "");
    $("#si-elimina").onclick = azione;
  }

  function foglioLinea(l) {
    const nuova = !l; l = l || { codice: "", nome: "", prodotto: { nome: "", descrizione: "" }, note: "" };
    foglio(`<h3>${nuova ? "Nuova linea" : "Modifica " + esc(l.codice)}</h3>
      <div class="due"><div class="campo"><label for="f-cod">Codice</label><input id="f-cod" value="${esc(l.codice)}" placeholder="L. KZ" autocomplete="off"></div>
      <div class="campo"><label for="f-sig">Sigla sul tasto</label><input id="f-sig" value="${esc(l.nome || "")}" placeholder="KZ" maxlength="6" autocomplete="off"></div></div>
      <div class="campo"><label for="f-pn">Prodotto</label><input id="f-pn" value="${esc(l.prodotto && l.prodotto.nome)}" placeholder="Cosa produce la linea"></div>
      <div class="campo"><label for="f-pd">Descrizione prodotto</label><textarea id="f-pd" rows="2" placeholder="Formato, confezione, particolarità">${esc(l.prodotto && l.prodotto.descrizione)}</textarea></div>
      <div class="campo"><label for="f-staz">Macchine in ordine</label><textarea id="f-staz" rows="5">${esc(stazioni(l).join("\n"))}</textarea><small>Una per riga, dalla prima all'ultima. Compaiono nel menu Macchine.</small></div>
      <div class="campo"><label for="f-note">Note</label><textarea id="f-note" rows="3" placeholder="Cose da sapere su questa linea">${esc(l.note || "")}</textarea></div>
      <div id="f-conf"></div>
      <div class="f-az">${nuova ? "" : '<button class="btn danger" type="button" id="f-del">Elimina</button>'}<div><button class="btn" type="button" id="f-ann">Annulla</button><button class="btn primary" type="button" id="f-ok">${nuova ? "Crea linea" : "Salva"}</button></div></div>`, () => {
      $("#f-ann").onclick = () => chiudiFoglio();
      $("#f-ok").onclick = async () => {
        const codice = $("#f-cod").value.trim(), nome = $("#f-sig").value.trim() || codice.replace(/^L\.\s*/i, "");
        if (!codice) { toast("Scrivi il codice della linea"); $("#f-cod").focus(); return; }
        if (S.lines.some((x) => x.codice === codice && x.id !== l.id)) { toast("Esiste già una linea " + codice); return; }
        const staz = $("#f-staz").value.split("\n").map((s) => s.trim()).filter(Boolean);
        const dati = { codice, nome, note: $("#f-note").value.trim(), stazioni: staz.length ? staz : STAZ_BASE,
          prodotto: { nome: $("#f-pn").value.trim(), descrizione: $("#f-pd").value.trim() }, aggiornato: ora() };
        bloccaBottoni(true);
        try {
          if (nuova) {
            const slug = nome.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
            const id = slug && !S.lines.some((x) => x.id === "l-" + slug) ? "l-" + slug : undefined;
            await S.db.collection("linee").doc(id).set(Object.assign({ metodo: [], parametri: {}, tolleranze: [], creato: ora() }, dati));
            S.linea = codice; salvaSel(); toast("Linea " + codice + " creata");
          } else {
            await S.db.doc("linee/" + l.id).update(dati);
            if (codice !== l.codice) {
              for (const p of procDi(l)) await S.db.doc("procedure/" + p.id).update({ linea: codice });
              for (const a of apDi(l)) await S.db.doc("appunti/" + a.id).update({ linea: codice });
              if (S.linea === l.codice) { S.linea = codice; salvaSel(); }
            }
            toast("Linea salvata");
          }
          chiudiFoglio();
        } catch (e) { bloccaBottoni(false); toast(errore(e, "Linea non salvata")); }
      };
      if (!nuova) $("#f-del").onclick = () => {
        const n = procDi(l).length, a = apDi(l).length;
        confermaElimina($("#f-conf"), `Elimini ${l.codice}${n || a ? ` insieme a ${n} procedimenti e ${a} appunti` : ""}? Non si torna indietro.`, async () => {
          bloccaBottoni(true);
          try {
            for (const p of procDi(l)) await S.db.doc("procedure/" + p.id).delete();
            for (const x of apDi(l)) await S.db.doc("appunti/" + x.id).delete();
            await S.db.doc("linee/" + l.id).delete();
            if (S.linea === l.codice) { S.linea = ""; salvaSel(); }
            toast("Linea eliminata"); chiudiFoglio();
          } catch (e) { bloccaBottoni(false); toast(errore(e, "Linea non eliminata")); }
        });
      };
    });
  }

  function foglioProc(p, lineaPred, copia, momPred) {
    const nuovo = !p || copia;
    const base = p || { titolo: "", linea: lineaPred || "", momento: momPred || "produzione", stazione: "", regola: "", passi: [], fonte: "" };
    let P = (base.passi || []).map((s) => ({ t: s.t || "", a: !!s.a, v: s.v }));
    if (!P.length) P.push({ t: "", a: false });
    const staz = () => stazioni(lineaDi($("#f-lin") ? $("#f-lin").value : base.linea));
    const optStaz = (sel) => `<option value="">Nessuna in particolare</option>` + staz().map((s) => `<option ${s === sel ? "selected" : ""}>${esc(s)}</option>`).join("") + (sel && !staz().includes(sel) ? `<option selected>${esc(sel)}</option>` : "");
    const fasiHtml = () => P.map((s, i) => `<div class="fase-e ${s.a ? "crit" : ""}"><span class="n">${i + 1}</span><div><textarea class="f-fase" data-i="${i}" rows="2" aria-label="Fase ${i + 1}" placeholder="Cosa fare in questa fase">${esc(s.t)}</textarea><div class="fase-az"><button type="button" data-crit="${i}" aria-pressed="${s.a}">⚠ Critica</button><button type="button" data-su="${i}" ${i ? "" : "disabled"} aria-label="Sposta su">↑</button><button type="button" data-giu="${i}" ${i < P.length - 1 ? "" : "disabled"} aria-label="Sposta giù">↓</button><button type="button" data-via="${i}">Togli</button></div>${s.v && s.v.length ? `<small class="ha-rif">◧ ${s.v.length} ${s.v.length === 1 ? "riferimento" : "riferimenti"} dal foglio</small>` : ""}</div></div>`).join("");
    foglio(`<h3>${copia ? "Duplica procedimento" : nuovo ? "Nuovo procedimento" : "Modifica procedimento"}</h3>
      <div class="campo"><label for="f-tit">Titolo</label><input id="f-tit" value="${esc(base.titolo)}" placeholder="Es. Concatenamento (cambio vasca)"></div>
      <div class="due"><div class="campo"><label for="f-lin">Linea</label><select id="f-lin">${optLinee(base.linea)}</select></div>
      <div class="campo"><label for="f-mom">Menu</label><select id="f-mom">${MOMENTI.map(([k, n]) => `<option value="${k}" ${momentoDi(base) === k ? "selected" : ""}>${n}</option>`).join("")}</select></div></div>
      <div class="campo"><label for="f-staz">Macchina</label><select id="f-staz">${optStaz(base.stazione)}</select></div>
      <div class="campo"><label for="f-reg">Regola critica</label><textarea id="f-reg" rows="2" placeholder="Quello che non va mai sbagliato. Va confermata prima della fase 1. Lascia vuoto se non c'è.">${esc(base.regola)}</textarea></div>
      <div class="campo"><span class="lbl">Fasi</span><div class="fasi" id="f-fasi">${fasiHtml()}</div>
        <div class="az"><button class="btn" type="button" id="f-add">+ Aggiungi fase</button><button class="btn" type="button" id="f-incolla-t">Incolla un testo</button></div>
        <div id="f-incolla" hidden class="campo"><textarea id="f-incolla-tx" rows="5" placeholder="Incolla qui la procedura: ogni riga diventa una fase"></textarea><div class="az"><button class="btn" type="button" id="f-incolla-ok">Trasforma in fasi</button></div></div></div>
      <div class="campo"><label for="f-fonte">Fonte o nota</label><input id="f-fonte" value="${esc(base.fonte)}" placeholder="Da dove viene la procedura"></div>
      <div id="f-conf"></div>
      <div class="f-az">${nuovo ? "" : '<button class="btn danger" type="button" id="f-del">Elimina</button>'}<div><button class="btn" type="button" id="f-ann">Annulla</button><button class="btn primary" type="button" id="f-ok">${nuovo ? "Crea" : "Salva"}</button></div></div>`, (f) => {
      const ridisegna = () => { $("#f-fasi").innerHTML = fasiHtml(); };
      f.addEventListener("input", (e) => { if (e.target.classList.contains("f-fase")) P[+e.target.dataset.i].t = e.target.value; });
      $("#f-fasi").addEventListener("click", (e) => {
        const b = e.target.closest("button"); if (!b) return;
        const d = b.dataset;
        if (d.crit != null) P[+d.crit].a = !P[+d.crit].a;
        else if (d.su != null) { const i = +d.su; [P[i - 1], P[i]] = [P[i], P[i - 1]]; }
        else if (d.giu != null) { const i = +d.giu; [P[i + 1], P[i]] = [P[i], P[i + 1]]; }
        else if (d.via != null) { P.splice(+d.via, 1); if (!P.length) P.push({ t: "", a: false }); }
        ridisegna();
      });
      $("#f-add").onclick = () => { P.push({ t: "", a: false }); ridisegna(); const t = document.querySelectorAll(".f-fase"); t[t.length - 1].focus(); };
      $("#f-incolla-t").onclick = () => { $("#f-incolla").hidden = !$("#f-incolla").hidden; if (!$("#f-incolla").hidden) $("#f-incolla-tx").focus(); };
      $("#f-incolla-ok").onclick = () => {
        const righe = $("#f-incolla-tx").value.split("\n").map((r) => r.replace(/^\s*(\d+[.)]|[-•*])\s*/, "").trim()).filter(Boolean);
        if (!righe.length) return;
        P = P.filter((s) => s.t.trim()).concat(righe.map((t) => ({ t, a: /^(attenzione|importante|vietato|mai|nb)\b/i.test(t) })));
        $("#f-incolla-tx").value = ""; $("#f-incolla").hidden = true; ridisegna(); toast(righe.length + " fasi aggiunte");
      };
      $("#f-lin").onchange = () => { $("#f-staz").innerHTML = optStaz($("#f-staz").value); };
      $("#f-ann").onclick = () => chiudiFoglio();
      $("#f-ok").onclick = async () => {
        const titolo = $("#f-tit").value.trim();
        if (!titolo) { toast("Dai un titolo al procedimento"); $("#f-tit").focus(); return; }
        if (!$("#f-lin").value) { toast("Crea prima una linea"); return; }
        const dati = { titolo, linea: $("#f-lin").value, momento: $("#f-mom").value, stazione: $("#f-staz").value, regola: $("#f-reg").value.trim(),
          passi: P.map((s) => Object.assign({ t: s.t.trim(), a: s.a }, s.v && s.v.length ? { v: s.v } : {})).filter((s) => s.t), fonte: $("#f-fonte").value.trim(), aggiornato: ora() };
        bloccaBottoni(true);
        try {
          if (nuovo) {
            const ref = S.db.collection("procedure").doc();
            await ref.set(Object.assign({ creato: ora() }, dati));
            chiudiFoglio(); toast(copia ? "Procedimento duplicato" : "Procedimento creato");
            apriEsec(ref.id);
          } else {
            await S.db.doc("procedure/" + p.id).update(dati);
            if ((p.passi || []).length !== dati.passi.length) { delete SP[p.id]; delete POS[p.id]; scrivi("spunte", SP); scrivi("posizione", POS); }
            chiudiFoglio(); toast("Procedimento salvato");
          }
        } catch (e) { bloccaBottoni(false); toast(errore(e, "Procedimento non salvato")); }
      };
      if (!nuovo) $("#f-del").onclick = () => confermaElimina($("#f-conf"), `Elimini "${p.titolo}"? Non si torna indietro.`, async () => {
        bloccaBottoni(true);
        try {
          await S.db.doc("procedure/" + p.id).delete();
          delete SP[p.id]; delete POS[p.id]; scrivi("spunte", SP); scrivi("posizione", POS);
          if (S.run === p.id) S.run = "";
          toast("Procedimento eliminato"); chiudiFoglio();
        } catch (e) { bloccaBottoni(false); toast(errore(e, "Procedimento non eliminato")); }
      });
    });
  }

  function foglioAp(a) {
    foglio(`<h3>Appunto</h3><span class="mono" style="font-size:12.5px;color:var(--ink-2)">Scritto ${esc(quando(a.creato))}${a.aggiornato && a.aggiornato !== a.creato ? " · modificato " + esc(quando(a.aggiornato)) : ""}</span>
      <div class="campo"><label for="f-al">Linea</label><select id="f-al" ${S.canWrite ? "" : "disabled"}>${optLinee(a.linea)}</select></div>
      <div class="campo"><label for="f-at">Testo</label><textarea id="f-at" rows="6" ${S.canWrite ? "" : "readonly"}>${esc(a.testo)}</textarea></div>
      <div id="f-conf"></div>
      <div class="f-az">${S.canWrite ? '<button class="btn danger" type="button" id="f-del">Elimina</button>' : ""}<div><button class="btn" type="button" id="f-copia">Copia</button><button class="btn" type="button" id="f-ann">Chiudi</button>${S.canWrite ? '<button class="btn primary" type="button" id="f-ok">Salva</button>' : ""}</div></div>`, () => {
      $("#f-ann").onclick = () => chiudiFoglio();
      $("#f-copia").onclick = () => copia($("#f-at").value);
      if ($("#f-ok")) $("#f-ok").onclick = async () => {
        const testo = $("#f-at").value.trim();
        if (!testo) { toast("L'appunto è vuoto"); return; }
        bloccaBottoni(true);
        try { await S.db.doc("appunti/" + a.id).update({ testo, linea: $("#f-al").value, aggiornato: ora() }); toast("Appunto salvato"); chiudiFoglio(); }
        catch (e) { bloccaBottoni(false); toast(errore(e, "Appunto non salvato")); }
      };
      if ($("#f-del")) $("#f-del").onclick = () => confermaElimina($("#f-conf"), "Elimini questo appunto?", async () => {
        bloccaBottoni(true);
        try { await S.db.doc("appunti/" + a.id).delete(); toast("Appunto eliminato"); chiudiFoglio(); }
        catch (e) { bloccaBottoni(false); toast(errore(e, "Appunto non eliminato")); }
      });
    });
  }
  function foglioTuttiAp() {
    foglio(`<h3>Tutti gli appunti · ${S.appunti.length}</h3><div>${S.appunti.length ? S.appunti.map((a) => rigaAp(a, true)).join("") : '<p class="vuoto">Nessun appunto scritto per ora. Si scrivono dalla scheda di una linea.</p>'}</div><div class="az"><button class="btn" type="button" id="f-ann">Chiudi</button></div>`, (f) => {
      $("#f-ann").onclick = () => chiudiFoglio();
      f.addEventListener("click", (e) => { const b = e.target.closest("[data-ap]"); if (!b) return; const a = S.appunti.find((x) => x.id === b.dataset.ap); if (a) foglioAp(a); });
    });
  }

  function copia(testo) {
    const fallback = () => {
      foglio(`<h3>Copia il testo</h3><div class="campo"><textarea id="f-copia-tx" rows="10" readonly>${esc(testo)}</textarea><small>Tieni premuto sul testo e scegli Copia.</small></div><div class="az"><button class="btn" type="button" id="f-ann">Chiudi</button></div>`, () => { $("#f-ann").onclick = () => chiudiFoglio(); $("#f-copia-tx").select(); });
    };
    try { navigator.clipboard.writeText(testo).then(() => toast("Testo copiato"), fallback); } catch (e) { fallback(); }
  }
  function testoProc(p) {
    return [p.titolo, p.linea + (p.stazione ? " · " + p.stazione : ""), p.regola ? "REGOLA: " + p.regola : "", "",
      ...(p.passi || []).map((s, i) => `${i + 1}. ${s.a ? "⚠ " : ""}${s.t}`), p.fonte ? "\n" + p.fonte : ""].filter((x, i) => x || i === 3).join("\n");
  }
  function foglioTesto(l, k) {
    const m = MOM[k] || [k, k === "macchine" ? "Macchine" : k, "", ""];
    foglio(`<h3>${esc(m[1])} · ${esc(sigla(l))}</h3>
      <div class="campo"><label for="f-tx">Note del menu</label><textarea id="f-tx" rows="8" placeholder="${esc(m[3] || "Scrivi qui…")}">${esc((l.sezioni || {})[k] || "")}</textarea><small>Le vede chiunque apra questo menu sulla linea ${esc(sigla(l))}.</small></div>
      <div class="f-az"><div><button class="btn" type="button" id="f-ann">Annulla</button><button class="btn primary" type="button" id="f-ok">Salva</button></div></div>`, () => {
      $("#f-ann").onclick = () => chiudiFoglio();
      $("#f-ok").onclick = async () => {
        const sez = Object.assign({}, l.sezioni || {}), t = $("#f-tx").value.trim();
        if (t) sez[k] = t; else delete sez[k];
        bloccaBottoni(true);
        try { await S.db.doc("linee/" + l.id).update({ sezioni: sez, aggiornato: ora() }); toast("Note salvate"); chiudiFoglio(); }
        catch (e) { bloccaBottoni(false); toast(errore(e, "Note non salvate")); }
      };
    });
  }
  function foglioProdotto(l) {
    const pr = l.prodotto || {};
    foglio(`<h3>Prodotto · ${esc(sigla(l))}</h3>
      <div class="campo"><label for="f-pn">Nome</label><input id="f-pn" value="${esc(pr.nome)}" placeholder="Cosa produce la linea"></div>
      <div class="campo"><label for="f-pd">Descrizione</label><textarea id="f-pd" rows="2" placeholder="Formato, confezione">${esc(pr.descrizione)}</textarea></div>
      <div class="campo"><label for="f-tx">Note sul prodotto</label><textarea id="f-tx" rows="5" placeholder="Codici, viscosità, attenzioni particolari">${esc((l.sezioni || {}).prodotto || "")}</textarea></div>
      <div class="f-az"><div><button class="btn" type="button" id="f-ann">Annulla</button><button class="btn primary" type="button" id="f-ok">Salva</button></div></div>`, () => {
      $("#f-ann").onclick = () => chiudiFoglio();
      $("#f-ok").onclick = async () => {
        const sez = Object.assign({}, l.sezioni || {}), t = $("#f-tx").value.trim();
        if (t) sez.prodotto = t; else delete sez.prodotto;
        bloccaBottoni(true);
        try {
          await S.db.doc("linee/" + l.id).update({ prodotto: Object.assign({}, pr, { nome: $("#f-pn").value.trim(), descrizione: $("#f-pd").value.trim() }), sezioni: sez, aggiornato: ora() });
          toast("Prodotto salvato"); chiudiFoglio();
        } catch (e) { bloccaBottoni(false); toast(errore(e, "Prodotto non salvato")); }
      };
    });
  }

  /* ---------- Eventi ---------- */
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b || b.disabled) return;
    if (b.closest("#foglio")) return;
    const d = b.dataset, l = lineaDi(S.linea), p = S.run && S.proc.find((x) => x.id === S.run);
    if (d.linea) { S.linea = d.linea; S.q = ""; $("#cerca").value = ""; salvaSel(); render(); window.scrollTo(0, 0); return; }
    if (d.menu) { APERTI[d.menu] = !APERTI[d.menu]; scrivi("menu-aperti", APERTI); render(); return; }
    if (d.proc) { apriEsec(d.proc); return; }
    if (d.ap) { const a = S.appunti.find((x) => x.id === d.ap); if (a) foglioAp(a); return; }
    if (d.vai != null && p) { const daElenco = !!b.closest(".elenco"); POS[p.id] = +d.vai; scrivi("posizione", POS); renderEsec(); if (daElenco) $("#esec").scrollTop = 0; return; }
    switch (d.act) {
      case "cambia-linea": S.linea = ""; salvaSel(); render(); window.scrollTo(0, 0); break;
      case "tutti-menu": { const tutti = MENU.every((k) => APERTI[k]); MENU.forEach((k) => (APERTI[k] = !tutti)); scrivi("menu-aperti", APERTI); render(); break; }
      case "note-sez": if (l) foglioTesto(l, d.k); break;
      case "mod-prodotto": if (l) foglioProdotto(l); break;
      case "nuova-linea": foglioLinea(null); break;
      case "mod-linea": if (l) foglioLinea(l); break;
      case "appunti": foglioTuttiAp(); break;
      case "nuovo-proc": foglioProc(null, l && l.codice, false, d.k); break;
      case "mod-proc": if (p) foglioProc(p); break;
      case "dup-proc": if (p) foglioProc(p, null, true); break;
      case "copia-proc": if (p) copia(testoProc(p)); break;
      case "chiudi-esec": S.run = ""; renderEsec(); render(); break;
      case "avanti": muovi(1, true); break;
      case "prec": muovi(-1, false); break;
      case "elenco": S.elenco = !S.elenco; renderEsec(); break;
      case "ricomincia": if (p) { delete SP[p.id]; POS[p.id] = 0; scrivi("spunte", SP); scrivi("posizione", POS); renderEsec(); } break;
      case "salva-ap": {
        const t = $("#ap-nuovo").value.trim(); if (!t || !l) { toast("Scrivi qualcosa prima"); break; }
        b.disabled = true;
        S.db.collection("appunti").doc().set({ testo: t, linea: l.codice, creato: ora(), aggiornato: ora() })
          .then(() => { if ($("#ap-nuovo")) $("#ap-nuovo").value = ""; toast("Appunto salvato"); }, (err) => toast(errore(err, "Appunto non salvato")))
          .finally(() => { b.disabled = false; });
        break;
      }
    }
  });
  $("#cerca").addEventListener("input", (e) => { S.q = e.target.value; if (S.okL) $("#app").innerHTML = S.q.trim() ? vRicerca() : vPannello(); });
  document.addEventListener("keydown", (e) => {
    if (chiudiFoglio) { if (e.key === "Escape") chiudiFoglio(); return; }
    if (!S.run) return;
    if (e.key === "Escape") { S.run = ""; renderEsec(); render(); }
    else if (e.key === "ArrowRight" && !/TEXTAREA|INPUT/.test(document.activeElement.tagName)) muovi(1, true);
    else if (e.key === "ArrowLeft" && !/TEXTAREA|INPUT/.test(document.activeElement.tagName)) muovi(-1, false);
  });

  /* ---------- Avvio ---------- */
  async function init() {
    const c = window.claude;
    if (c && c.use) {
      try { S.db = await c.use("db"); } catch (e) { S.db = null; }
      try { const u = await c.use("user"); if (u && typeof u.can === "function") { const cw = await u.can("data.write"); S.canWrite = cw !== false; } } catch (e) {}
    }
    S.ready = true; render();
    if (!S.db) return;
    S.db.collection("linee").onSnapshot((snap) => {
      S.lines = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())).sort((a, b) => nat(a.codice, b.codice));
      S.okL = true; if (!chiudiFoglio) render();
    }, () => { S.err = true; render(); });
    S.db.collection("procedure").onSnapshot((snap) => {
      S.proc = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
      if (!chiudiFoglio) render();
    }, () => {});
    S.db.collection("appunti").onSnapshot((snap) => {
      S.appunti = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())).sort((a, b) => String(b.creato || "").localeCompare(String(a.creato || "")));
      if (!chiudiFoglio) render();
    }, () => {});
  }
  init();
})();
</script>
